name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys clobbering each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Configure Pages (auto-enable if not already)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # If this step fails with "Deployment cancelled." or "due to in progress deployment", Pages is
        # holding a stuck deployment from an earlier run. Retrying cannot clear it, because Pages keys a
        # deployment on the commit SHA and the stuck one blocks every new attempt. Cancel it explicitly:
        #   gh api --method POST repos/<owner>/<repo>/pages/deployments/<sha>/cancel
        # then push a new commit. Raising the action's timeout does not help: 600000 ms is both the
        # default and the maximum it accepts, and anything larger is silently capped.
        uses: actions/deploy-pages@v5
