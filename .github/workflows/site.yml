name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys clobbering each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Configure Pages (auto-enable if not already)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # The action drops dotpaths by default, which silently excluded /.well-known/security.txt
          # from the deployed artifact. dist is generated output; .git/.github stay excluded regardless.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # If this step fails with "Deployment cancelled." or "due to in progress deployment", Pages is
        # holding a stuck deployment from an earlier run. Retrying cannot clear it, because Pages keys a
        # deployment on the commit SHA and the stuck one blocks every new attempt. Cancel it with the
        # FULL sha (a short sha returns a silent 404), after which `gh run rerun <id> --failed` works
        # and no new commit is needed:
        #   gh api --method POST repos/<owner>/<repo>/pages/deployments/<full-sha>/cancel
        # Raising the action's timeout does not help: 600000 ms is both the default and the maximum it
        # accepts, and anything larger is silently capped.
        uses: actions/deploy-pages@v5

      # Ping IndexNow (Bing, Yandex, Seznam, Naver) once the new build is actually live. Google does
      # not use IndexNow and is covered by Search Console plus the sitemap in robots.txt.
      # This job does not otherwise check out the repo, so the script would not exist without this.
      - uses: actions/checkout@v5

      # continue-on-error: a search-engine ping must never turn a good deploy into a failed one.
      - name: Tell IndexNow the site changed
        continue-on-error: true
        env:
          INDEXNOW_KEY: 6859f82b21abec5c7b846a95f86d0d1a
          INDEXNOW_HOST: tessio.eu
        run: node scripts/submit-indexnow.mjs
